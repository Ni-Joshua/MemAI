<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 10px;
        }

        #chat {
            width: 80%;
            max-width: 800px;
            height: 40vh;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-size: 1.2rem;
            background-color: #f9f9f9;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message {
            max-width: 70%;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            text-align: right;
        }

        .ai {
            align-self: flex-start;
            background-color: #e5e5e5;
            color: black;
        }

        #input-area {
            width: 80%;
            max-width: 800px;
            margin-top: 20px;
        }


        .input-top-row {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-bottom-row {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        textarea {
            flex: 1;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            resize: none;
            height: 100px;
            width: 300px
        }

        button {
            font-size: 1rem;
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        input[type="file"] {
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            #input-area {
                flex-direction: column;
            }

            textarea {
                width: 100%;
                height: 60px;
            }

            button,
            input[type="file"] {
                width: 100%;
            }
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            /* Dark transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
        }

        #overlay-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>

<body>
    <h1>AI Study Buddy</h1>
    <div id="chat"></div>
    <div id="overlay">
        <div id="overlay-content">
            <p>Please upload a file before using the chat.</p>
            <input type="file" id="fileInput1" onchange="enableTextInput()" accept=".pdf,.jpg,.jpeg,.png">
        </div>
    </div>
    <div id="input-area">
        <div class="input-top-row">
            <textarea id="message" placeholder="Type a message..." rows="5" disabled></textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
        <div class="input-bottom-row">
            <button id="speakButton">Start Speech to Text</button>
            <input type="file" id="fileInput" onchange="uploadFile()" accept=".pdf,.jpg,.jpeg,.png">
        </div>
    </div>


    <script>
        const ws = new WebSocket("ws://localhost:8000");
        const allowedExtensions = ["pdf", "jpg", "jpeg", "png"];
        let fileUploaded = false;
        let currentAIMessage = null;
        const displayDiv = document.getElementById('message');
        const sttButton = document.getElementById('speakButton');
        let micStream, audioCtx, processor;
        let fullSentences = [];
        let sttActive = false;
        const chatDiv = document.getElementById("chat");
        let messages = [];        // { text: "...", sender: "user"|"ai" }
        let chatEnabled = true;   // controls whether we show them or hide them


        navigator.mediaDevices.getUserMedia({ audio: true })

        sttButton.addEventListener("click", async () => {
            if (!sttActive) {
                clearChatView();
                await startSTT();
            } else {
                stopSTT();
            }
            sttActive = !sttActive;
        });

        displayDiv.addEventListener("input", () => {
            clearChatView();
        })
        ws.onopen = (event) => {
            console.log("WebSocket opened.");
            displayDiv.value = "";
            ['fileInput', 'fileInput1'].forEach(id => {
                const input = document.getElementById(id);
                if (input) input.value = '';
            });
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "realtime") {
                displayRealtimeText(data.text, displayDiv);
            } else if (data.type === 'fullSentence') {
                fullSentences.push(data.text);
                displayRealtimeText("", displayDiv); // Refresh display with new full sentence
            }
            else if (data.type === "AI") {
                displayMessage(data.text, "ai");
            }
        };

        ws.onclose = () => {
            console.log("WebSocket closed.");
        };

        displayDiv.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                if (event.shiftKey) {
                    event.preventDefault();
                    this.value += "\n";  // New line
                } else {
                    event.preventDefault();
                    sendMessage();
                }
            }
        });

        function sendMessage() {
            if (!fileUploaded) {
                alert("Please upload a file before sending messages.");
                return;
            }
            const text = displayDiv.value.trim();

            if (!text) return;


            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "text", text: text }));
                stopSTT();

                // Always show user's message immediately
                displayMessage(text, "user");

                // Reset streamed AI message placeholder
                currentAIMessage = document.createElement("div");
                currentAIMessage.classList.add("message", "ai");
                currentAIMessage.textContent = ""; // start empty
                document.getElementById("chat").appendChild(currentAIMessage);
                displayDiv.value = "";
                chatEnabled = true;
                renderChat();
            }
        }

        function renderChat() {
            chatDiv.innerHTML = "";
            if (!chatEnabled) return;
            for (const msg of messages) {
                const el = document.createElement("div");
                el.classList.add("message", msg.sender);
                // Wrap content in a <span> so MathJax can typeset it
                el.innerHTML = `<span class="mathjax">${msg.text}</span>`;
                chatDiv.appendChild(el);
            }
            chatDiv.scrollTop = chatDiv.scrollHeight;
            // Ask MathJax to typeset any new math
            MathJax.typesetPromise && MathJax.typesetPromise();
        }

        function clearChatView() {
            chatEnabled = false;
            renderChat();          // this will blank out the <div id="chat">
        }

        function displayRealtimeText(realtimeText, displayDiv) {
            displayDiv.value = fullSentences.join(" ") + realtimeText;
        }

        function enableTextInput() {
            const fileInput = document.getElementById("fileInput1");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];

                // Get file extension
                const fileExtension = file.name.split('.').pop().toLowerCase();

                if (!allowedExtensions.includes(fileExtension)) {
                    alert("Invalid file type! Please upload a supported file.");
                    fileInput.value = ""; // Reset input
                    fullSentences = []
                    return;
                }

                // Update displayed file name
                displayDiv.disabled = false;
                uploadFile("fileInput1")
            }
        }

        function displayMessage(text, sender, forceNew = false) {
            const lastIsAI = messages.length > 0 && messages[messages.length - 1].sender === sender;
            if (!forceNew && sender === "ai" && lastIsAI) {
                // append to last AI message
                messages[messages.length - 1].text += text;
            } else {
                // new message
                messages.push({ text, sender });
            }
            renderChat();
        }

        async function uploadFile(source = "fileInput") {
            const fileInput = document.getElementById(source);
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file to upload.");
                return;
            }

            // Validate extension
            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!allowedExtensions.includes(fileExtension)) {
                alert("Invalid file type! Please upload a supported file.");
                return;
            }

            // Read the file as a base64 data URL
            const dataURL = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(reader.error);
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });

            // Send over WebSocket as a JSON message
            const payload = {
                type: "file",
                filename: file.name,
                fileData: dataURL
            };
            ws.send(JSON.stringify(payload));

            // Optionally, wait for an ack from the server before proceeding
            ws.addEventListener("message", function ackListener(evt) {
                const msg = JSON.parse(evt.data);
                if (msg.type === "upload_ack" && msg.filename === file.name) {
                    // server confirms it received and stored the file
                    displayMessage(msg.message, "ai", true);
                    displayDiv.disabled = false;
                    fileUploaded = true;
                    document.getElementById("overlay").style.display = "none";
                    ws.removeEventListener("message", ackListener);
                }
            });
        }

        function splitIntoSentences(text) {
            // This regex splits on punctuation (., ?, !) but keeps it at end of each chunk
            const regex = /[^.!?]+[.!?]*/g;
            const matches = text.match(regex);
            return matches ? matches.map(s => s.trim()) : [];
        }

        async function startSTT() {
            if (micStream) return;
            const existingText = displayDiv.value.trim();
            fullSentences = splitIntoSentences(existingText);
            displayDiv.value = "";
            sttButton.textContent = "Stop Speech to Text";
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(micStream);
            processor = audioCtx.createScriptProcessor(256, 1, 1);
            source.connect(processor);
            processor.connect(audioCtx.destination);

            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const output = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    output[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
                }

                let metadata = JSON.stringify({ sampleRate: audioCtx.sampleRate });
                let metadataBytes = new TextEncoder().encode(metadata);
                let metadataLength = new ArrayBuffer(4);
                let metadataLengthView = new DataView(metadataLength);
                metadataLengthView.setInt32(0, metadataBytes.byteLength, true);
                let combinedData = new Blob([metadataLength, metadataBytes, output.buffer]);
                ws.send(combinedData);
            };
        }
        function stopSTT() {
            if (!micStream) return;             // already stopped
            sttButton.textContent = "Start Speech to Text";
            micStream.getTracks().forEach(t => t.stop());
            processor.disconnect();
            audioCtx.close();
            micStream = null;
        }

    </script>



</body>

</html>
