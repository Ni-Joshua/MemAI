<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 10px;
        }

        #chat {
            width: 80%;
            max-width: 800px;
            height: 40vh;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            font-size: 1.2rem;
            background-color: #f9f9f9;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .message {
            max-width: 70%;
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
            text-align: right;
        }

        .ai {
            align-self: flex-start;
            background-color: #e5e5e5;
            color: black;
        }

        #input-area {
            width: 80%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        textarea {
            flex: 1;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            resize: none;
        }

        button {
            font-size: 1rem;
            padding: 10px 15px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        input[type="file"] {
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            #input-area {
                flex-direction: column;
            }

            textarea {
                width: 100%;
                height: 60px;
            }

            button,
            input[type="file"] {
                width: 100%;
            }
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            /* Dark transparent background */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1000;
        }

        #overlay-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
    </style>


</head>

<body>
    <h1>AI Study Buddy</h1>
    <div id="chat"></div>
    <div id="overlay">
        <div id="overlay-content">
            <p>Please upload a file before using the chat.</p>
            <input type="file" id="fileInput1" onchange="enableTextInput()" accept=".pdf,.jpg,.jpeg,.png">
        </div>
    </div>
    <div id="input-area">
        <textarea id="message" placeholder="Type a message..." rows="3" disabled></textarea>
        <button onclick="sendMessage()">Send</button>
        <button id="speakButton" onclick="">Start Speech to Text</button>
        <input type="file" id="fileInput" onchange="uploadFile()" accept=".pdf,.jpg,.jpeg,.png">
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const allowedExtensions = ["pdf", "jpg", "jpeg", "png"];
        let fileUploaded = false;
        let currentAIMessage = null;
        let displayDiv = document.getElementById('message');
        let sttButton = document.getElementById('speakButton');
        let micStream, audioCtx, processor;
        let fullSentences = [];
        let sttActive = false;

        navigator.mediaDevices.getUserMedia({ audio: true })

        sttButton.addEventListener("click", async () => {
            if (!sttActive) {
                await startSTT();
                sttButton.textContent = "Stop Speech to Text";
            } else {
                stopSTT();
                sttButton.textContent = "Start Speech to Text";
            }
            sttActive = !sttActive;
        });

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "realtime") {
                displayRealtimeText(data.text, displayDiv);
            } else if (data.type === 'fullSentence') {
                fullSentences.push(data.text);
                displayRealtimeText("", displayDiv); // Refresh display with new full sentence
            }
            else if (data.type === "AI") {
                if (!currentAIMessage) {
                    currentAIMessage = document.createElement("div");
                    currentAIMessage.classList.add("message", "ai");
                    document.getElementById("chat").appendChild(currentAIMessage);
                }

                currentAIMessage.textContent += data.text;
                document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
            }
        };

        ws.onclose = () => {
            console.log("WebSocket closed.");
        };

        displayDiv.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                if (event.shiftKey) {
                    event.preventDefault();
                    this.value += "\n";  // New line
                } else {
                    event.preventDefault();
                    sendMessage();
                }
            }
        });

        function sendMessage() {
            if (!fileUploaded) {
                alert("Please upload a file before sending messages.");
                return;
            }
            const text = displayDiv.value.trim();

            if (!text) return;


            if (ws.readyState === WebSocket.OPEN) {
                ws.send(text);

                // Always show user's message immediately
                displayMessage(text, "user");

                // Reset streamed AI message placeholder
                currentAIMessage = document.createElement("div");
                currentAIMessage.classList.add("message", "ai");
                currentAIMessage.textContent = ""; // start empty
                document.getElementById("chat").appendChild(currentAIMessage);
                displayDiv.value = "";
            }
        }

        function displayRealtimeText(realtimeText, displayDiv) {
            displayDiv.value = fullSentences.join(" ") + realtimeText;
        }

        function enableTextInput() {
            const fileInput = document.getElementById("fileInput1");

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];

                // Get file extension
                const fileExtension = file.name.split('.').pop().toLowerCase();

                if (!allowedExtensions.includes(fileExtension)) {
                    alert("Invalid file type! Please upload a supported file.");
                    fileInput.value = ""; // Reset input
                    fullSentences = []
                    return;
                }

                // Update displayed file name
                displayDiv.disabled = false;
                uploadFile("fileInput1")
            }
        }

        function displayMessage(text, sender) {
            const chat = document.getElementById("chat");
            const messageElement = document.createElement("div");
            messageElement.classList.add("message", sender);
            messageElement.textContent = text;
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight;
        }

        function uploadFile(source = "fileInput") {
            const fileInput = document.getElementById(source);
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select a file to upload.");
                return;
            }

            // Get file extension and validate
            const fileExtension = file.name.split('.').pop().toLowerCase();

            if (!allowedExtensions.includes(fileExtension)) {
                alert("Invalid file type! Please upload a supported file.");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            fetch("http://localhost:8000/upload/", {
                method: "POST",
                body: formData
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error || "Unknown error"); });
                    }
                    return response.json();
                })
                .then(data => {
                    // Ensure correct file name is passed to chat
                    displayMessage(data.message, "ai");

                    displayDiv.disabled = false;
                    fileUploaded = true;

                    // Hide overlay
                    document.getElementById("overlay").style.display = "none";
                })
                .catch(error => {
                    console.error("Error uploading file:", error);
                    alert("Error uploading file: " + error.message);
                });
        }
        async function startSTT() {
            if (micStream) return;              // already running
            micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaStreamSource(micStream);
            processor = audioCtx.createScriptProcessor(256, 1, 1);
            source.connect(processor);
            processor.connect(audioCtx.destination);

            processor.onaudioprocess = (e) => {
                const input = e.inputBuffer.getChannelData(0);
                const output = new Int16Array(input.length);
                for (let i = 0; i < input.length; i++) {
                    output[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
                }

                let metadata = JSON.stringify({ sampleRate: audioCtx.sampleRate });
                let metadataBytes = new TextEncoder().encode(metadata);
                let metadataLength = new ArrayBuffer(4);
                let metadataLengthView = new DataView(metadataLength);
                metadataLengthView.setInt32(0, metadataBytes.byteLength, true);
                let combinedData = new Blob([metadataLength, metadataBytes, output.buffer]);
                ws.send(combinedData);
            };
        }
        function stopSTT() {
            if (!micStream) return;             // already stopped
            micStream.getTracks().forEach(t => t.stop());
            processor.disconnect();
            audioCtx.close();
            micStream = null;
        }

    </script>



</body>

</html>
